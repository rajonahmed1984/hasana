<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>হাসানা — অফলাইন</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 70% 20%, #177a6d, #0d3b34);
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .arabic { font-size: 64px; color: #dfab3b; font-weight: 700; line-height: 1; }
        h1 { font-size: 22px; margin: 20px 0 8px; }
        p { opacity: .8; line-height: 1.7; font-size: 15px; margin: 0; }
        button {
            margin-top: 24px;
            padding: 12px 28px;
            border: 0;
            border-radius: 999px;
            background: #dfab3b;
            color: #0d3b34;
            font-weight: 700;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <!-- Shown by Capacitor (server.errorPath) when the app cannot load and nothing is cached yet -->
    <div>
        <div class="arabic">حسنة</div>
        <h1>ইন্টারনেট সংযোগ নেই</h1>
        <p>প্রথমবার অ্যাপ চালু করতে ইন্টারনেট প্রয়োজন।<br>একবার চালু হলে কুরআন ও দোয়া অফলাইনেও পড়া যাবে।</p>
        <button type="button" onclick="location.replace('https://hasanaa.com/')">আবার চেষ্টা করুন</button>
    </div>
</body>
</html>
